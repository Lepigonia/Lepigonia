name: Production API smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Wait for Vercel deployment
        run: sleep 30
      - name: Run production API smoke test
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/api-smoke-test.mjs
